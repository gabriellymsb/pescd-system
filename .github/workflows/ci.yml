name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Testes de unidade (backend)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pescd
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "1234"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build e testes
        run: ./mvnw -B verify

      - name: Relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: ignore

      - name: Relatório de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: ignore

  frontend-build:
    name: Build do front-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

  e2e-tests:
    name: Testes E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [unit-tests, frontend-build]

    steps:
      - uses: actions/checkout@v4

      - name: Verifica se o subprojeto e2e existe
        id: e2e
        run: |
          if [ -f e2e/package.json ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=E2E::Subprojeto e2e/ ainda não existe; testes E2E ignorados."
          fi

      - uses: actions/setup-java@v4
        if: steps.e2e.outputs.enabled == 'true'
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - uses: actions/setup-node@v4
        if: steps.e2e.outputs.enabled == 'true'
        with:
          node-version: "20"

      - name: Sobe Postgres e SeaweedFS
        if: steps.e2e.outputs.enabled == 'true'
        run: docker compose up -d

      - name: Sobe a API
        if: steps.e2e.outputs.enabled == 'true'
        run: |
          ./mvnw -B -DskipTests package
          nohup java -jar target/pescd-0.0.1-SNAPSHOT.jar > api.log 2>&1 &
          timeout 120 bash -c 'until curl -sf -o /dev/null http://localhost:8082/v3/api-docs; do sleep 2; done'

      - name: Sobe o front-end
        if: steps.e2e.outputs.enabled == 'true'
        working-directory: frontend
        run: |
          npm ci
          nohup npm run dev -- --port 5173 --strictPort > ../frontend.log 2>&1 &
          timeout 60 bash -c 'until curl -sf -o /dev/null http://localhost:5173; do sleep 2; done'

      - name: Executa os testes E2E
        if: steps.e2e.outputs.enabled == 'true'
        working-directory: e2e
        env:
          BASE_URL: http://localhost:5173
        run: |
          npm ci
          npx playwright install --with-deps
          npx playwright test

      - name: Relatório do Playwright
        if: always() && steps.e2e.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore

      - name: Logs da aplicação
        if: failure() && steps.e2e.outputs.enabled == 'true'
        run: |
          echo "::group::api.log"; cat api.log || true; echo "::endgroup::"
          echo "::group::frontend.log"; cat frontend.log || true; echo "::endgroup::"
